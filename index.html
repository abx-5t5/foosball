<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foosball Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-sky"></div>
  <div class="bg-sun"></div>
  <div class="bg-grid"></div>

  <div class="scoreboard">
    <div class="team team-red">
      <div class="team-name">RED</div>
      <div class="score" id="red-score">0</div>
    </div>
    <div class="team team-blue">
      <div class="team-name">BLUE</div>
      <div class="score" id="blue-score">0</div>
    </div>
  </div>

  <div class="winner-banner" id="winner-banner" hidden></div>

  <div class="controls">
    <button class="btn btn-red" id="red-btn">RED</button>
    <button class="btn btn-blue" id="blue-btn">BLUE</button>
    <button class="btn btn-reset" id="reset-btn">RESET</button>
  </div>

  <div class="confetti" id="confetti"></div>

  <script src="script.js"></script>
</body>
</html>
